[package]
name = "luarust-cli"
description = "The luarust command."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "luarust"
path = "src/main.rs"

[features]
default = []
# Off by default: everything else builds with no dependencies at all, and only this needs
# LLVM installed.
jit = ["dep:luarust-jit"]

[dependencies]
luarust-jit = { path = "../luarust-jit", optional = true }
luarust-check = { path = "../luarust-check" }
luarust-conf = { path = "../luarust-conf" }
luarust-core = { path = "../luarust-core" }
luarust-diag = { path = "../luarust-diag" }
luarust-interp = { path = "../luarust-interp" }
luarust-lex = { path = "../luarust-lex" }
luarust-parse = { path = "../luarust-parse" }
luarust-vm = { path = "../luarust-vm" }
luarust-gen = { path = "../luarust-gen" }
