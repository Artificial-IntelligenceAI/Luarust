name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    # Luarust is developed on an arm64 Mac, so x86-64 is hardware the code has
    # otherwise never run on. ubuntu and windows are x86-64; macos is arm64.
    name: test / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  name: linux-x86_64 }
          - { os: windows-latest, name: windows-x86_64 }
          - { os: macos-latest,   name: macos-arm64 }
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: rustc --version && cargo --version && rustc --print cfg | grep target_arch

      # Debug first: the soft-float carries debug_assert!s about how wide an
      # intermediate is allowed to get, and release compiles them out.
      # `--workspace` would drag in luarust-jit, which is the one crate that needs LLVM
      # installed. It has a job of its own below.
      - name: Test (debug, with debug_assert! active)
        run: cargo test --workspace --exclude luarust-jit --all-targets

      - name: Test (release)
        run: cargo test --workspace --exclude luarust-jit --all-targets --release

  footprint:
    name: footprint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The rule is that nothing goes onto the machine that runs a program unless that
      # program uses it. A dependency added in the wrong place would break that silently,
      # so it is checked rather than remembered.
      - name: The runtime carries no front end
        run: |
          tree=$(cargo tree -p luarust-run --edges normal --prefix none)
          echo "$tree"
          for crate in luarust-lex luarust-parse luarust-check luarust-gen luarust-jit; do
            if echo "$tree" | grep -q "^$crate "; then
              echo "::error::luarust-run links $crate, which a program does not need to run."
              exit 1
            fi
          done

      - name: The VM builds as a runtime, with no compiler in it
        run: cargo build -p luarust-vm --no-default-features

      - name: How big the two of them are
        run: |
          cargo build --release -p luarust-cli -p luarust-run
          strip target/release/luarust target/release/luarust-run
          ls -l target/release/luarust target/release/luarust-run | awk '{print $9, $5}'

  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Type-directed, so every generated program compiles, and both execution paths have
      # to agree about every one of them.
      - run: cargo run --release -p luarust-cli -- fuzz 200000

  jit:
    name: jit / linux-x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: LLVM 21
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          sudo add-apt-repository -y "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-21 main"
          sudo apt-get install -y -qq llvm-21-dev libpolly-21-dev
      - name: Test the third execution path
        env:
          LLVM_SYS_211_PREFIX: /usr/lib/llvm-21
        run: cargo test -p luarust-jit --release
      - name: Lint it
        env:
          LLVM_SYS_211_PREFIX: /usr/lib/llvm-21
        run: |
          rustup component add clippy
          cargo clippy -p luarust-jit --all-targets -- -D warnings

  editor:
    name: editor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The grammar is a copy of what the compiler already decides, and a copy left alone
      # goes stale quietly. This is what stops that.
      - name: The grammar and the suggestions know what the compiler does
        run: python3 editors/vscode/check-grammar.py
      - name: The extension will actually start
        run: python3 editors/vscode/check-manifest.py
      - name: Each word is offered once, and each snippet says what it inserts
        run: node editors/vscode/check-suggestions.js
      - name: The extension is valid JSON and valid JavaScript
        run: |
          for f in editors/vscode/package.json \
                   editors/vscode/language-configuration.json \
                   editors/vscode/syntaxes/luarust.tmLanguage.json \
                   editors/vscode/syntaxes/luarust-toml.tmLanguage.json \
                   editors/vscode/toml-configuration.json; do
            python3 -c "import json,sys;json.load(open(sys.argv[1]))" "$f"
          done
          node --check editors/vscode/src/extension.js
          node --check editors/vscode/src/complete.js
          node --check editors/vscode/src/complete-toml.js

  lint:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup component add clippy
      - run: cargo clippy --workspace --exclude luarust-jit --all-targets -- -D warnings
