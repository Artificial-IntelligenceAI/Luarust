# Manual only, and temporary: the x86-64 interpreter investigation on fable/perf.
#
# Round 1 killed the divide-latency hypothesis. Round 2's same-op-count control showed
# the mod op costs no more than a subtract, and its profiles found the time: 16-byte SSE
# stores of Value and Result structs to the stack, with int_op's jump-table dispatch
# second. The interpreters move structs through memory on the dependent chain; Apple
# silicon forwards store-to-load at nearly no cost, Zen 4 charges every hop.
#
# Round 3 measures the first fix: HEAD boxes the Fault inside Stopped (Result<Value,
# Stopped> falls 96 -> 32 bytes), HEAD^ does not. Both are built and timed in the same
# sitting, since the runner's numbers move by a third between sittings.
name: diagnose

on:
  push:
    branches: [fable/perf]
    paths: ['.github/workflows/diagnose.yml']

jobs:
  diagnose:
    name: boxed against unboxed, on x86-64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Machine
        run: |
          uname -m; nproc
          grep -m1 "model name" /proc/cpuinfo || true

      - name: Build both
        run: |
          cargo build --release -p luarust-cli
          cp target/release/luarust luarust-boxed
          git checkout HEAD^ -- crates/
          cargo build --release -p luarust-cli
          cp target/release/luarust luarust-unboxed
          git checkout HEAD -- crates/
          cmp -s luarust-boxed luarust-unboxed && echo "::error::the two builds are identical" || true

      - name: Programs
        run: |
          N=100000000
          cat > modloop.lr <<EOF
          var.local.mut.i64 ['sum'] = [|0|];
          loop.temp.range.i64 ['i'] = [|1|, |$N|] {
              set ['sum'] = [math { ('sum' + 'i') mod 1000000007 }];
          }
          print['sum'];
          EOF
          cat > addloop.lr <<EOF
          var.local.mut.i64 ['sum'] = [|0|];
          loop.temp.range.i64 ['i'] = [|1|, |$N|] {
              set ['sum'] = [math { ('sum' + 'i') }];
          }
          print['sum'];
          EOF

      - name: Times, interleaved
        run: |
          set +e
          declare -A best last_out
          for round in 1 2 3; do
            for v in unboxed boxed; do
              for prog in modloop addloop; do
                for eng in run interp; do
                  t0=$(date +%s%N)
                  out=$(./luarust-$v $eng $prog.lr | tr -d '\n')
                  t1=$(date +%s%N)
                  ms=$(( (t1 - t0) / 1000000 ))
                  key="$v $eng $prog"
                  cur=${best[$key]:-99999999}
                  [ "$ms" -lt "$cur" ] && best[$key]=$ms
                  last_out[$key]=$out
                done
              done
            done
          done
          for key in "${!best[@]}"; do
            printf "%-28s %7s ms   %s\n" "$key" "${best[$key]}" "${last_out[$key]}"
          done | sort

      - name: Profile the boxed build
        run: |
          set +e
          sudo apt-get install -y -qq linux-tools-common linux-tools-generic >/dev/null 2>&1
          PERF=$(ls /usr/lib/linux-tools/*/perf 2>/dev/null | head -1)
          [ -z "$PERF" ] && PERF=perf
          sudo sysctl -w kernel.perf_event_paranoid=1 >/dev/null 2>&1
          mkdir -p prof
          profile() {
            local tag="$1"; shift
            echo "======== $tag"
            $PERF record -q -o "$tag.data" -F 997 -e task-clock "$@" >/dev/null 2>&1
            $PERF report -i "$tag.data" --stdio --percent-limit 1 2>/dev/null \
              | grep -v "^#" | grep -v "^$" | head -15 | tee "prof/$tag.report"
            $PERF report -i "$tag.data" --stdio --percent-limit 5 2>/dev/null \
              | awk '$1 ~ /%/ { $1=""; $2=""; $3=""; $4=""; print }' \
              | while read -r sym; do
                  echo "======== annotate: $sym" >> "prof/$tag.annotate"
                  $PERF annotate -i "$tag.data" --stdio --percent-limit 0.2 --symbol="$sym" >> "prof/$tag.annotate" 2>/dev/null
                done
          }
          profile boxed-vm-add     ./luarust-boxed run addloop.lr
          profile boxed-vm-mod     ./luarust-boxed run modloop.lr
          profile boxed-interp-mod ./luarust-boxed interp modloop.lr
          exit 0

      - name: Keep the annotated profiles
        uses: actions/upload-artifact@v4
        with:
          name: profiles-boxed
          path: prof/
