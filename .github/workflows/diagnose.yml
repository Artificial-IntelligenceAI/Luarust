# Manual only, and temporary: the x86-64 interpreter investigation on fable/perf.
#
# Round 1 (in this file's history) killed the divide-latency hypothesis: C with a real
# idiv per iteration ran as fast as C with the strength-reduced constant, on the same
# runner where the interpreters lose 2.6-5x per iteration against the M5 -- and the
# add-only loop, which divides nothing, already carries most of the penalty.
#
# Round 2 asks where the time actually goes: perf record on a task-clock software event,
# which works where the runner's PMU does not, over the add and mod loops in both
# interpreters. Plus a same-op-count subtract control, so op count and op kind stop
# being one variable.
name: diagnose

on:
  push:
    branches: [fable/perf]
    paths: ['.github/workflows/diagnose.yml']

jobs:
  diagnose:
    name: where x86-64 spends it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Machine
        run: |
          uname -m; nproc
          grep -m1 "model name" /proc/cpuinfo || true
          lscpu | grep -E "MHz|BogoMIPS" || true

      - name: Build Luarust
        run: cargo build --release -p luarust-cli

      - name: Programs
        run: |
          N=100000000
          cat > modloop.lr <<EOF
          var.local.mut.i64 ['sum'] = [|0|];
          loop.temp.range.i64 ['i'] = [|1|, |$N|] {
              set ['sum'] = [math { ('sum' + 'i') mod 1000000007 }];
          }
          print['sum'];
          EOF
          cat > addloop.lr <<EOF
          var.local.mut.i64 ['sum'] = [|0|];
          loop.temp.range.i64 ['i'] = [|1|, |$N|] {
              set ['sum'] = [math { ('sum' + 'i') }];
          }
          print['sum'];
          EOF
          cat > add2loop.lr <<EOF
          var.local.mut.i64 ['sum'] = [|0|];
          loop.temp.range.i64 ['i'] = [|1|, |$N|] {
              set ['sum'] = [math { ('sum' + 'i') - 1000000007 }];
          }
          print['sum'];
          EOF
          cat > bench_divmod.c <<'EOF'
          #include <stdio.h>
          #include <stdlib.h>
          int main(int argc, char **argv) {
              long n = atol(argv[1]), m = atol(argv[2]), sum = 0;
              for (long i = 1; i <= n; i++) sum = (sum + i) % m;
              printf("%ld", sum);
              return 0;
          }
          EOF
          sed -i 's/^          //' bench_divmod.c
          cc -O2 -o bench_divmod bench_divmod.c
          echo "--- idiv really is in the C control's loop:"
          objdump -d bench_divmod | grep -c idiv

      - name: Times
        run: |
          set +e
          bench() {
            local name="$1"; shift
            local best=99999999 out=""
            for _ in 1 2 3; do
              local t0=$(date +%s%N)
              out=$("$@" 2>&1 | tr -d '\n')
              local t1=$(date +%s%N)
              local ms=$(( (t1 - t0) / 1000000 ))
              [ "$ms" -lt "$best" ] && best=$ms
            done
            printf "%-24s %7s ms   %s\n" "$name" "$best" "$out"
          }
          LR=./target/release/luarust
          bench "C argv mod (idiv)"  ./bench_divmod 100000000 1000000007
          bench "VM mod"             $LR run modloop.lr
          bench "VM add2 (sub)"      $LR run add2loop.lr
          bench "VM add"             $LR run addloop.lr
          bench "interp mod"         $LR interp modloop.lr
          bench "interp add2 (sub)"  $LR interp add2loop.lr
          bench "interp add"         $LR interp addloop.lr

      - name: Profiles
        run: |
          set +e
          sudo apt-get install -y -qq linux-tools-common linux-tools-generic >/dev/null 2>&1
          PERF=$(ls /usr/lib/linux-tools/*/perf 2>/dev/null | head -1)
          [ -z "$PERF" ] && PERF=perf
          $PERF --version
          sudo sysctl -w kernel.perf_event_paranoid=1 >/dev/null 2>&1
          sudo sysctl -w kernel.kptr_restrict=0 >/dev/null 2>&1
          LR=./target/release/luarust
          profile() {
            local tag="$1"; shift
            echo "======== $tag"
            $PERF record -q -o "$tag.data" -F 997 -e task-clock "$@" >/dev/null 2>&1
            $PERF report -i "$tag.data" --stdio --percent-limit 1 2>/dev/null | grep -v "^#" | grep -v "^$" | head -15
            # Instruction-level detail for every symbol carrying at least 5% of the time.
            $PERF report -i "$tag.data" --stdio --percent-limit 5 2>/dev/null \
              | awk '$1 ~ /%/ { $1=""; $2=""; $3=""; $4=""; print }' \
              | while read -r sym; do
                  echo "---- annotate: $sym"
                  $PERF annotate -i "$tag.data" --stdio --percent-limit 2 --symbol="$sym" 2>/dev/null | head -80
                done
          }
          profile vm-add     $LR run addloop.lr
          profile vm-mod     $LR run modloop.lr
          profile interp-add $LR interp addloop.lr
          profile interp-mod $LR interp modloop.lr
          exit 0
