# Manual only, and temporary: the x86-64 interpreter investigation on fable/perf.
#
# Round 8: the mechanism finally has a name -- a vector store read back narrow cannot
# forward on x86-64 (round 7: 12x on Zen 3) -- and HEAD writes integer results into
# their register a field at a time to avoid the shape. Raced against the build before
# it and the pre-investigation baseline, interleaved, C alongside.
name: diagnose

on:
  push:
    branches: [fable/perf]
    paths: ['.github/workflows/diagnose.yml']

jobs:
  diagnose:
    name: matched-width writes against the field
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 25

      - name: Machine
        run: |
          grep -m1 "model name" /proc/cpuinfo || true

      - name: Build all three
        run: |
          cargo build --release -p luarust-cli
          cp target/release/luarust luarust-inplace
          git checkout HEAD~4 -- crates/
          cargo build --release -p luarust-cli
          cp target/release/luarust luarust-micro
          git checkout 14c87bc^ -- crates/
          cargo build --release -p luarust-cli
          cp target/release/luarust luarust-baseline
          git checkout HEAD -- crates/

      - name: Programs
        run: |
          N=100000000
          cat > modloop.lr <<EOF
          var.local.mut.i64 ['sum'] = [|0|];
          loop.temp.range.i64 ['i'] = [|1|, |$N|] {
              set ['sum'] = [math { ('sum' + 'i') mod 1000000007 }];
          }
          print['sum'];
          EOF
          cat > addloop.lr <<EOF
          var.local.mut.i64 ['sum'] = [|0|];
          loop.temp.range.i64 ['i'] = [|1|, |$N|] {
              set ['sum'] = [math { ('sum' + 'i') }];
          }
          print['sum'];
          EOF
          cat > bench_mod.c <<'CEOF'
          #include <stdio.h>
          #include <stdlib.h>
          int main(int argc, char **argv) {
              long n = atol(argv[1]), sum = 0;
              for (long i = 1; i <= n; i++) sum = (sum + i) % 1000000007L;
              printf("%ld", sum);
              return 0;
          }
          CEOF
          sed -i 's/^          //' bench_mod.c
          cc -O2 -o bench_mod bench_mod.c

      - name: Times, interleaved
        run: |
          set +e
          declare -A best last_out
          for round in 1 2 3; do
            for v in baseline micro inplace; do
              for prog in modloop addloop; do
                for eng in run interp; do
                  t0=$(date +%s%N)
                  out=$(./luarust-$v $eng $prog.lr | tr -d '\n')
                  t1=$(date +%s%N)
                  ms=$(( (t1 - t0) / 1000000 ))
                  key="$v $eng $prog"
                  cur=${best[$key]:-99999999}
                  [ "$ms" -lt "$cur" ] && best[$key]=$ms
                  last_out[$key]=$out
                done
              done
            done
            t0=$(date +%s%N); out=$(./bench_mod 100000000); t1=$(date +%s%N)
            ms=$(( (t1 - t0) / 1000000 ))
            cur=${best[C]:-99999999}; [ "$ms" -lt "$cur" ] && best[C]=$ms
            last_out[C]=$out
          done
          for key in "${!best[@]}"; do
            printf "%-30s %7s ms   %s\n" "$key" "${best[$key]}" "${last_out[$key]}"
          done | sort
