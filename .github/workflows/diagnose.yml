# Manual only, and temporary: the x86-64 interpreter investigation on fable/perf.
#
# Round 7 final form: gcc would not emit a 16-byte store from a struct copy or even a
# 16-byte memcpy, so the store is now an SSE intrinsic -- the same movupd/movdqu shape
# rustc gives the VM's hottest instruction. objdump printed 0 twice before; this time
# the count is part of the verdict.
name: diagnose

on:
  push:
    branches: [fable/perf]
    paths: ['.github/workflows/diagnose.yml']

jobs:
  diagnose:
    name: an SSE store, read back narrow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Machine
        run: |
          grep -m1 "model name" /proc/cpuinfo || true
      - name: Probe
        run: |
          set +e
          cat > forward2.c <<'CEOF'
          // Probe v2: the exact store shape the VM emits, against the friendly one.
          //
          //   narrow   ty and bits stored separately, bits loaded back at its own width
          //   wide     the whole 16-byte struct stored in one move, bits loaded narrow
          //            at offset 8, the discriminant loaded narrow at offset 0
          //
          // The barriers stop the compiler from forwarding in registers; the hardware still
          // may. If a machine charges for a narrow load carved out of a wide store, the wide
          // column shows it; the VM's hottest instruction is exactly that wide store.
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #ifdef __x86_64__
          #include <immintrin.h>
          #endif
          #include <time.h>

          struct V { unsigned char disc; unsigned short ty; unsigned long bits; };

          static long now_ms(void) {
              struct timespec t;
              clock_gettime(CLOCK_MONOTONIC, &t);
              return t.tv_sec * 1000L + t.tv_nsec / 1000000L;
          }

          struct V regs[8];

          int main(int argc, char **argv) {
              long n = atol(argv[1]);

              long t0 = now_ms();
              unsigned long sum = 0;
              for (long i = 1; i <= n; i++) {
                  regs[2].disc = 1; regs[2].ty = 3; regs[2].bits = sum + i;
                  __asm__ volatile("" ::: "memory");
                  unsigned long b = regs[2].bits;
                  regs[0].disc = 1; regs[0].ty = 3; regs[0].bits = b;
                  __asm__ volatile("" ::: "memory");
                  sum = regs[0].bits;
              }
              long t1 = now_ms();
              printf("narrow %5ld ms   %lu\n", t1 - t0, sum);

              t0 = now_ms();
              sum = 0;
              for (long i = 1; i <= n; i++) {
                  struct V t = { 1, 3, sum + i };
          #ifdef __x86_64__
                  _mm_storeu_si128((__m128i *)&regs[2], _mm_loadu_si128((__m128i *)&t));
          #else
                  __builtin_memcpy(&regs[2], &t, 16);
          #endif
                  __asm__ volatile("" ::: "memory");
                  unsigned char d = regs[2].disc;
                  struct V u = { d, 3, regs[2].bits };
          #ifdef __x86_64__
                  _mm_storeu_si128((__m128i *)&regs[0], _mm_loadu_si128((__m128i *)&u));
          #else
                  __builtin_memcpy(&regs[0], &u, 16);
          #endif
                  __asm__ volatile("" ::: "memory");
                  sum = regs[0].bits;
              }
              t1 = now_ms();
              printf("wide   %5ld ms   %lu\n", t1 - t0, sum);
              return 0;
          }

          CEOF
          sed -i 's/^          //' forward2.c
          cc -O2 -o forward2 forward2.c
          echo "--- 16-byte vector stores present, says objdump:"
          objdump -d forward2 | grep -cE "movups|movaps|movdqu"
          for _ in 1 2 3; do ./forward2 100000000; echo; done
          exit 0
