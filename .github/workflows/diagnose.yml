# Manual only, and temporary: the x86-64 interpreter investigation on fable/perf.
#
# Round 3's lesson beyond the numbers: the runner pool is heterogeneous (EPYC 9V74 one
# sitting, Xeon 6973P the next), so nothing compares across runs. Everything below runs
# interleaved in one job, with C along as the machine's own yardstick.
#
# Round 4 races three builds: unboxed baseline, boxed Stopped, and boxed plus
# inline(always) on int_op. Boxing was flat on x86 in round 3; the profiles say the
# remaining per-op cost is the int_op call and its inner dispatch, and the Value store
# into the register file. inline(always) prices the first of those.
name: diagnose

on:
  push:
    branches: [fable/perf]
    paths: ['.github/workflows/diagnose.yml']

jobs:
  diagnose:
    name: three builds, one sitting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 10

      - name: Machine
        run: |
          uname -m; nproc
          grep -m1 "model name" /proc/cpuinfo || true

      - name: Build all three
        run: |
          # HEAD carries inline(always); the boxing landed in 14c87bc; its parent is
          # the unboxed baseline. Named by content, not by position, so a later commit
          # on the branch cannot silently shift what this job measures.
          cargo build --release -p luarust-cli
          cp target/release/luarust luarust-inline
          git checkout 14c87bc -- crates/
          cargo build --release -p luarust-cli
          cp target/release/luarust luarust-boxed
          git checkout 14c87bc^ -- crates/
          cargo build --release -p luarust-cli
          cp target/release/luarust luarust-unboxed
          git checkout HEAD -- crates/

      - name: Programs
        run: |
          N=100000000
          cat > modloop.lr <<EOF
          var.local.mut.i64 ['sum'] = [|0|];
          loop.temp.range.i64 ['i'] = [|1|, |$N|] {
              set ['sum'] = [math { ('sum' + 'i') mod 1000000007 }];
          }
          print['sum'];
          EOF
          cat > addloop.lr <<EOF
          var.local.mut.i64 ['sum'] = [|0|];
          loop.temp.range.i64 ['i'] = [|1|, |$N|] {
              set ['sum'] = [math { ('sum' + 'i') }];
          }
          print['sum'];
          EOF
          cat > bench_mod.c <<'EOF'
          #include <stdio.h>
          #include <stdlib.h>
          int main(int argc, char **argv) {
              long n = atol(argv[1]), sum = 0;
              for (long i = 1; i <= n; i++) sum = (sum + i) % 1000000007L;
              printf("%ld", sum);
              return 0;
          }
          EOF
          sed -i 's/^          //' bench_mod.c
          cc -O2 -o bench_mod bench_mod.c

      - name: Times, interleaved
        run: |
          set +e
          declare -A best last_out
          for round in 1 2 3; do
            for v in unboxed boxed inline; do
              for prog in modloop addloop; do
                for eng in run interp; do
                  t0=$(date +%s%N)
                  out=$(./luarust-$v $eng $prog.lr | tr -d '\n')
                  t1=$(date +%s%N)
                  ms=$(( (t1 - t0) / 1000000 ))
                  key="$v $eng $prog"
                  cur=${best[$key]:-99999999}
                  [ "$ms" -lt "$cur" ] && best[$key]=$ms
                  last_out[$key]=$out
                done
              done
            done
            t0=$(date +%s%N); out=$(./bench_mod 100000000); t1=$(date +%s%N)
            ms=$(( (t1 - t0) / 1000000 ))
            cur=${best[C]:-99999999}; [ "$ms" -lt "$cur" ] && best[C]=$ms
            last_out[C]=$out
          done
          for key in "${!best[@]}"; do
            printf "%-28s %7s ms   %s\n" "$key" "${best[$key]}" "${last_out[$key]}"
          done | sort
