# Manual only, and temporary: the x86-64 interpreter investigation on fable/perf.
#
# Round 5 is a machine probe, not a Luarust build: the same dependent add-chain in
# registers, through one store->load hop, and through three, in C with volatile. The M5
# runs the three-hop chain at ~1.3 ns/iter -- renamed away. Whatever this runner charges
# per hop, times the hops a VM op takes, is the interpreters' x86 penalty if the
# forwarding story is right.
name: diagnose

on:
  push:
    branches: [fable/perf]
    paths: ['.github/workflows/diagnose.yml']

jobs:
  diagnose:
    name: pricing a store-to-load hop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Machine
        run: |
          grep -m1 "model name" /proc/cpuinfo || true
      - name: Probe
        run: |
          cat > forward.c <<'CEOF'
          // A latency probe, not a benchmark: the same dependent add-chain three ways.
          //
          //   reg    the whole chain in registers, the way C runs the loop
          //   mem1   one store->load hop per step through a 16-byte struct slot
          //   mem3   three hops per step, the way a register VM moves op results around
          //
          // volatile forces every access to actually reach the store buffer, which is the
          // point: the difference between the columns prices store-to-load forwarding on
          // this machine, which Apple silicon renames away and x86 charges per hop.
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <time.h>

          struct V { unsigned short ty; unsigned long bits; };

          static long now_ms(void) {
              struct timespec t;
              clock_gettime(CLOCK_MONOTONIC, &t);
              return t.tv_sec * 1000L + t.tv_nsec / 1000000L;
          }

          int main(int argc, char **argv) {
              long n = atol(argv[1]);
              volatile struct V regs[8];
              memset((void *)regs, 0, sizeof regs);

              long t0 = now_ms();
              long sum = 0;
              for (long i = 1; i <= n; i++) sum = sum + i;
              long t1 = now_ms();
              printf("reg   %5ld ms   %ld\n", t1 - t0, sum);

              t0 = now_ms();
              regs[0].bits = 0;
              for (long i = 1; i <= n; i++) {
                  unsigned long s = regs[0].bits;
                  regs[0].ty = 3;
                  regs[0].bits = s + i;
              }
              t1 = now_ms();
              printf("mem1  %5ld ms   %ld\n", t1 - t0, (long)regs[0].bits);

              t0 = now_ms();
              regs[0].bits = 0;
              for (long i = 1; i <= n; i++) {
                  unsigned long a = regs[0].bits;      // load sum
                  regs[2].ty = 3; regs[2].bits = a + i; // store temp
                  unsigned long b = regs[2].bits;      // load temp
                  regs[0].ty = 3; regs[0].bits = b;    // store sum
              }
              t1 = now_ms();
              printf("mem3  %5ld ms   %ld\n", t1 - t0, (long)regs[0].bits);
              return 0;
          }

          CEOF
          sed -i 's/^          //' forward.c
          cc -O2 -o forward forward.c
          for _ in 1 2 3; do ./forward 100000000; echo; done
