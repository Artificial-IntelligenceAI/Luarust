# Not part of CI. A one-off, manually triggered look at lust-rs, an unrelated
# Lua-in-Rust language whose JIT is x86-64 only -- which is why this runs here
# rather than on anyone's arm64 Mac. Nothing in Luarust depends on it.
name: lust probe

on:
  workflow_dispatch:

jobs:
  probe:
    name: try lust-rs on x86-64 linux
    runs-on: ubuntu-latest
    steps:
      - name: Machine
        run: uname -m && nproc && rustc --version

      - name: Install lust-rs
        run: |
          set +e
          time cargo install lust-rs
          echo "=== install exit: $? ==="
          ls -la ~/.cargo/bin/
          exit 0

      - name: Version and help
        run: |
          set +e
          for b in lust lust-rs lustc; do
            if command -v $b >/dev/null; then
              echo "=== $b --version ==="; $b --version
              echo "=== $b --help ==="; $b --help
            fi
          done
          exit 0

      - name: Hello world
        run: |
          set +e
          cat > hello.lust <<'EOF'
          println("hello from lust")
          EOF
          lust hello.lust
          exit 0

      - name: Typed program
        run: |
          set +e
          cat > typed.lust <<'EOF'
          function add(a: int, b: int): int
              return a + b
          end

          local x: int = 41
          println("sum = " .. tostring(add(x, 1)))
          EOF
          lust typed.lust
          echo "=== exit: $? ==="
          exit 0

      - name: What a broken program says
        run: |
          set +e
          cat > broken.lust <<'EOF'
          local x: int = "not a number"
          println(y)
          EOF
          echo "--- source ---"; cat -n broken.lust
          echo "--- lust says ---"; lust broken.lust
          echo "=== exit: $? ==="
          exit 0

      - name: Disassembly
        run: |
          set +e
          cat > loop.lust <<'EOF'
          local sum: int = 0
          for i = 1, 10 do
              sum = (sum + i) % 1000000007
          end
          println(tostring(sum))
          EOF
          lust --disassemble loop.lust 2>&1 | head -50
          exit 0

      - name: Hot loop, the benchmark Luarus already has numbers for
        run: |
          set +e
          sudo apt-get install -y -qq lua5.4 luajit >/dev/null 2>&1
          mk(){ cat > bench.lust <<EOF
          local sum: int = 0
          for i = 1, $1 do
              sum = (sum + i) % 1000000007
          end
          println(tostring(sum))
          EOF
          cat > bench.lua <<EOF
          local sum = 0
          for i = 1, $1 do
              sum = (sum + i) % 1000000007
          end
          print(sum)
          EOF
          }
          for N in 10000000 100000000; do
            echo "################ N = $N ################"
            mk $N
            echo "--- lust ---";    time timeout 600 lust bench.lust
            echo "--- lua5.4 ---";  time timeout 600 lua5.4 bench.lua
            echo "--- luajit ---";  time timeout 600 luajit bench.lua
          done
          exit 0
