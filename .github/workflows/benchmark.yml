# Manual only. Luarust against Lua 5.4, LuaJIT and lust-rs, on one x86-64 machine,
# on the dependent-chain loop that cannot be folded away.
name: benchmark

on:
  workflow_dispatch:

jobs:
  bench:
    name: Luarust against the Luas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Machine
        run: |
          uname -m; nproc
          grep -m1 "model name" /proc/cpuinfo || true

      # Pinned, because the table in the README names a version. Left to the runner's
      # default it would change under us and the label beside the number would quietly
      # stop being true.
      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: LLVM 21, for the JIT
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          sudo add-apt-repository -y "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-21 main"
          sudo apt-get install -y -qq llvm-21-dev libpolly-21-dev

      - name: Build Luarust
        env:
          LLVM_SYS_211_PREFIX: /usr/lib/llvm-21
        run: cargo build --release -p luarust-cli --features jit

      - name: Install the others
        run: |
          set +e
          sudo apt-get install -y -qq lua5.4 luajit pypy3 >/dev/null 2>&1
          lua5.4 -v; luajit -v; java --version | head -1; cc --version | head -1
          pypy3 -VV | head -1; python3 -VV
          echo "-- the versions above are what the README's table is describing --"
          exit 0

      - name: Run
        run: |
          set +e
          # Every runner is timed three times and judged on its best, and on whether it
          # printed the answer. Without that second half a program that stopped at once
          # with an error reported five milliseconds and looked like a triumph -- which
          # is exactly what happened when the language's literal syntax changed under
          # this file and nobody was reading the third column.
          bench() {
            local name="$1"; shift
            local best=99999999 out=""
            for _ in 1 2 3; do
              local t0=$(date +%s%N)
              out=$("$@" 2>&1 | tr -d '\n')
              local t1=$(date +%s%N)
              local ms=$(( (t1 - t0) / 1000000 ))
              [ "$ms" -lt "$best" ] && best=$ms
            done
            if [ "$out" != "$EXPECTED" ]; then
              printf "%-14s   WRONG ANSWER -- expected %s, got: %s\n" "$name" "$EXPECTED" "$out"
              WRONG=1
              return
            fi
            printf "%-14s %7s ms   %s\n" "$name" "$best" "$out"
          }

          # The compiled languages read N from the command line so it cannot be folded
          # away. Luarust has no argv yet, so its N is written into the source -- which
          # the scaling check below is there to catch if it ever starts to matter.
          cat > Bench.java <<'EOF'
          public class Bench {
              public static void main(String[] args) {
                  long n = Long.parseLong(args[0]);
                  long sum = 0;
                  for (long i = 1; i <= n; i++) sum = (sum + i) % 1000000007L;
                  System.out.print(sum);
              }
          }
          EOF
          sed -i 's/^          //' Bench.java
          javac Bench.java

          cat > bench.c <<'EOF'
          #include <stdio.h>
          #include <stdlib.h>
          int main(int argc, char **argv) {
              long n = atol(argv[1]), sum = 0;
              for (long i = 1; i <= n; i++) sum = (sum + i) % 1000000007L;
              printf("%ld", sum);
              return argc - argc;
          }
          EOF
          cc -O2 -o bench_c bench.c

          cat > bench.rs <<'EOF'
          fn main() {
              let n: i64 = std::env::args().nth(1).unwrap().parse().unwrap();
              let mut sum: i64 = 0;
              for i in 1..=n { sum = (sum + i) % 1000000007; }
              print!("{sum}");
          }
          EOF
          rustc -O -o bench_rs bench.rs

          WRONG=0
          for N in 10000000 100000000; do
            echo "################  N = $N  ################"
            # The answer every one of them has to produce, worked out by the one that is
            # certainly right: `sum(1..N) mod 1000000007`, done in shell arithmetic.
            EXPECTED=$(( (N * (N + 1) / 2) % 1000000007 ))
            echo "expecting $EXPECTED"

            cat > bench.lr <<EOF
          var.local.mut.i64 ['sum'] = [|0|];
          loop.temp.range.i64 ['i'] = [|1|, |$N|] {
              set ['sum'] = [math { ('sum' + 'i') mod 1000000007 }];
          }
          print['sum'];
          EOF

            cat > bench.lua <<EOF
          local sum = 0
          for i = 1, $N do
            sum = (sum + i) % 1000000007
          end
          io.write(sum)
          EOF

            cat > bench.py <<EOF
          import sys
          total = 0
          for i in range(1, $N + 1):
              total = (total + i) % 1000000007
          sys.stdout.write(str(total))
          EOF
          sed -i 's/^          //' bench.py


            bench "C, clang -O2"   ./bench_c $N
            bench "Rust, rustc -O"  ./bench_rs $N
            bench "Java 21"        java Bench $N
            bench "Lua 5.4"        lua5.4 bench.lua
            bench "LuaJIT"         luajit bench.lua
            bench "PyPy"           pypy3 bench.py
            bench "Luarust JIT"    ./target/release/luarust jit bench.lr
            bench "Luarust VM"     ./target/release/luarust run bench.lr
            bench "Luarust interp" ./target/release/luarust interp bench.lr
            bench "CPython"        python3 bench.py
            echo
          done
          if [ "$WRONG" != "0" ]; then
            echo "::error::a benchmark did not produce the right answer, so its timing means nothing."
            exit 1
          fi
          exit 0
