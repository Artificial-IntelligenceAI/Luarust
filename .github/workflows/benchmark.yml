# Manual only. Luarust against Lua 5.4, LuaJIT and lust-rs, on one x86-64 machine,
# on the dependent-chain loop that cannot be folded away.
name: benchmark

on:
  workflow_dispatch:

jobs:
  bench:
    name: Luarust against the Luas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Machine
        run: |
          uname -m; nproc
          grep -m1 "model name" /proc/cpuinfo || true

      - name: Build Luarust
        run: cargo build --release

      - name: Install the others
        run: |
          set +e
          sudo apt-get install -y -qq lua5.4 luajit >/dev/null 2>&1
          cargo install lust-rs >/dev/null 2>&1
          lua5.4 -v; luajit -v; lust --version
          exit 0

      - name: Run
        run: |
          set +e
          bench() {
            local name="$1"; shift
            local best=99999999 out=""
            for _ in 1 2 3; do
              local t0=$(date +%s%N)
              out=$("$@" 2>&1 | tr -d '\n')
              local t1=$(date +%s%N)
              local ms=$(( (t1 - t0) / 1000000 ))
              [ "$ms" -lt "$best" ] && best=$ms
            done
            printf "%-14s %7s ms   %s\n" "$name" "$best" "$out"
          }

          for N in 10000000 100000000; do
            echo "################  N = $N  ################"

            cat > bench.lr <<EOF
          var.local.mut.ui64 ['sum'] = ['0'];
          loop.temp.range.ui64 ['i'] = ['1', '$N'] {
              set ['sum'] = [math { ('sum' + 'i') mod 1000000007 }];
          }
          print['sum'];
          EOF

            cat > bench.lua <<EOF
          local sum = 0
          for i = 1, $N do
            sum = (sum + i) % 1000000007
          end
          io.write(sum)
          EOF

            cat > bench.lust <<EOF
          local sum: int = 0
          for i = 1, $N do
            sum = (sum + i) % 1000000007
          end
          println(tostring(sum))
          EOF

            bench "Lua 5.4"  lua5.4 bench.lua
            bench "LuaJIT"   luajit bench.lua
            bench "Lust"     lust bench.lust
            bench "Luarust"  ./target/release/luarust run bench.lr
            echo
          done
          exit 0
